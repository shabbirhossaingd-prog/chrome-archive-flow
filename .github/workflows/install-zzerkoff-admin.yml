name: ZZERKOFF Admin Installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create safety backup branch
        shell: bash
        run: |
          set -e
          git branch "backup-before-zzerkoff-admin-${GITHUB_RUN_ID}"
          git push origin "backup-before-zzerkoff-admin-${GITHUB_RUN_ID}"

      - name: Install ZZERKOFF admin CMS upgrade
        shell: bash
        run: |
          set -e
          cat > /tmp/zzerkoff-admin-upgrade.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/zzerkoff-admin-upgrade.b64 > /tmp/zzerkoff-admin-upgrade.tar.gz
          tar -xzf /tmp/zzerkoff-admin-upgrade.tar.gz -C .
          rm -f /tmp/zzerkoff-admin-upgrade.b64 /tmp/zzerkoff-admin-upgrade.tar.gz

      - name: Commit and push upgrade
        shell: bash
        run: |
          set -e
          git config user.name "ZZERKOFF Admin Installer"
          git config user.email "actions@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Install ZZERKOFF admin CMS upgrade"
          git push origin HEAD:main
