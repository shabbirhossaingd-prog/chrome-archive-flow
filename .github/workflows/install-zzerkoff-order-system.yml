name: ZZERKOFF Website Order System Installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create safety backup
        shell: bash
        run: |
          set -e
          BACKUP="backup-before-order-system-${GITHUB_RUN_ID}"
          git branch "$BACKUP"
          git push origin "$BACKUP"
          echo "Backup: $BACKUP"

      - name: Add database migration record
        shell: bash
        run: |
          cat > supabase/migrations/20260816140000_zzerkoff_orders.sql <<'SQL'
          -- ZZERKOFF WEBSITE ORDER SYSTEM
          -- Run this ONCE in Lovable Cloud -> SQL editor.

          CREATE SEQUENCE IF NOT EXISTS public.order_number_seq START 1;

          CREATE TABLE IF NOT EXISTS public.orders (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            order_number text NOT NULL UNIQUE,
            source text NOT NULL DEFAULT 'website',
            status text NOT NULL DEFAULT 'new'
              CHECK (status IN ('new', 'confirmed', 'processing', 'shipped', 'delivered', 'cancelled')),

            customer_name text NOT NULL CHECK (char_length(customer_name) BETWEEN 2 AND 120),
            phone text NOT NULL CHECK (char_length(phone) BETWEEN 7 AND 30),
            delivery_address text NOT NULL CHECK (char_length(delivery_address) BETWEEN 5 AND 600),
            map_url text,
            latitude numeric,
            longitude numeric,
            customer_note text,

            product_id uuid REFERENCES public.products(id) ON DELETE SET NULL,
            product_name text NOT NULL,
            product_code text NOT NULL,
            unit_price numeric NOT NULL CHECK (unit_price >= 0),
            quantity integer NOT NULL CHECK (quantity BETWEEN 1 AND 20),
            selected_size text,
            selected_finish text,
            total_price numeric NOT NULL CHECK (total_price >= 0),

            admin_note text NOT NULL DEFAULT '',
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE INDEX IF NOT EXISTS orders_created_at_idx
            ON public.orders (created_at DESC);

          CREATE INDEX IF NOT EXISTS orders_status_idx
            ON public.orders (status);

          ALTER TABLE public.orders ENABLE ROW LEVEL SECURITY;

          GRANT SELECT, UPDATE ON public.orders TO authenticated;
          GRANT ALL ON public.orders TO service_role;

          DROP POLICY IF EXISTS "Admins view orders" ON public.orders;
          CREATE POLICY "Admins view orders"
          ON public.orders
          FOR SELECT TO authenticated
          USING (private.has_role(auth.uid(), 'admin'::app_role));

          DROP POLICY IF EXISTS "Admins update orders" ON public.orders;
          CREATE POLICY "Admins update orders"
          ON public.orders
          FOR UPDATE TO authenticated
          USING (private.has_role(auth.uid(), 'admin'::app_role))
          WITH CHECK (private.has_role(auth.uid(), 'admin'::app_role));

          DROP TRIGGER IF EXISTS orders_touch_updated_at ON public.orders;
          CREATE TRIGGER orders_touch_updated_at
          BEFORE UPDATE ON public.orders
          FOR EACH ROW EXECUTE FUNCTION public.touch_updated_at();

          CREATE OR REPLACE FUNCTION public.create_public_order(
            p_product_id uuid,
            p_customer_name text,
            p_phone text,
            p_address text,
            p_size text,
            p_finish text,
            p_quantity integer,
            p_map_url text,
            p_latitude numeric,
            p_longitude numeric,
            p_note text
          )
          RETURNS TABLE(order_number text, total_price numeric)
          LANGUAGE plpgsql
          SECURITY DEFINER
          SET search_path = public
          AS $$
          DECLARE
            v_product public.products%ROWTYPE;
            v_order_number text;
            v_total numeric;
          BEGIN
            IF char_length(trim(COALESCE(p_customer_name, ''))) < 2 THEN
              RAISE EXCEPTION 'Please enter your name.';
            END IF;

            IF char_length(trim(COALESCE(p_phone, ''))) < 7 THEN
              RAISE EXCEPTION 'Please enter a valid phone number.';
            END IF;

            IF char_length(trim(COALESCE(p_address, ''))) < 5 THEN
              RAISE EXCEPTION 'Please enter your full delivery address.';
            END IF;

            IF p_quantity IS NULL OR p_quantity < 1 OR p_quantity > 20 THEN
              RAISE EXCEPTION 'Invalid quantity.';
            END IF;

            SELECT *
            INTO v_product
            FROM public.products
            WHERE id = p_product_id
              AND published = true
            LIMIT 1;

            IF NOT FOUND THEN
              RAISE EXCEPTION 'This object is no longer available.';
            END IF;

            IF v_product.stock_status = 'SOLD OUT'
               OR v_product.quantity_available <= 0
               OR p_quantity > v_product.quantity_available THEN
              RAISE EXCEPTION 'Requested quantity is not available.';
            END IF;

            IF COALESCE(array_length(v_product.sizes, 1), 0) > 0
               AND NOT (COALESCE(p_size, '') = ANY(v_product.sizes)) THEN
              RAISE EXCEPTION 'Please select a valid size.';
            END IF;

            IF COALESCE(array_length(v_product.finish, 1), 0) > 0
               AND NOT (COALESCE(p_finish, '') = ANY(v_product.finish)) THEN
              RAISE EXCEPTION 'Please select a valid finish.';
            END IF;

            v_order_number :=
              'ZZ-' ||
              to_char(now(), 'YYMMDD') ||
              '-' ||
              lpad(nextval('public.order_number_seq')::text, 4, '0');

            v_total := v_product.price * p_quantity;

            INSERT INTO public.orders (
              order_number, source, status, customer_name, phone, delivery_address,
              map_url, latitude, longitude, customer_note, product_id, product_name,
              product_code, unit_price, quantity, selected_size, selected_finish, total_price
            )
            VALUES (
              v_order_number, 'website', 'new', trim(p_customer_name), trim(p_phone),
              trim(p_address), NULLIF(trim(COALESCE(p_map_url, '')), ''), p_latitude,
              p_longitude, NULLIF(trim(COALESCE(p_note, '')), ''), v_product.id,
              v_product.name, v_product.product_code, v_product.price, p_quantity,
              NULLIF(trim(COALESCE(p_size, '')), ''),
              NULLIF(trim(COALESCE(p_finish, '')), ''), v_total
            );

            RETURN QUERY SELECT v_order_number, v_total;
          END;
          $$;

          REVOKE ALL ON FUNCTION public.create_public_order(
            uuid, text, text, text, text, text, integer, text, numeric, numeric, text
          ) FROM PUBLIC;

          GRANT EXECUTE ON FUNCTION public.create_public_order(
            uuid, text, text, text, text, text, integer, text, numeric, numeric, text
          ) TO anon, authenticated, service_role;
          SQL

      - name: Add customer order modal
        shell: bash
        run: |
          mkdir -p src/components/site
          cat > src/components/site/OrderModal.tsx <<'TSX'
          import { useEffect, useState } from "react";
          import { ArrowUpRight, Check, Loader2, MapPin, X } from "lucide-react";
          import { supabase } from "@/integrations/supabase/client";

          type OrderModalProps = {
            open: boolean;
            onClose: () => void;
            productId: string;
            productName: string;
            productCode: string;
            unitPrice: number;
            currencySymbol: string;
            size: string;
            finish: string;
            quantity: number;
          };

          const inputClass =
            "w-full rounded-2xl border border-border/70 bg-white/[0.02] px-4 py-4 text-xs tracking-[0.08em] text-foreground outline-none transition-colors placeholder:text-muted-foreground/55 focus:border-chrome/70";

          export function OrderModal({
            open,
            onClose,
            productId,
            productName,
            productCode,
            unitPrice,
            currencySymbol,
            size,
            finish,
            quantity,
          }: OrderModalProps) {
            const [name, setName] = useState("");
            const [phone, setPhone] = useState("");
            const [address, setAddress] = useState("");
            const [note, setNote] = useState("");
            const [mapUrl, setMapUrl] = useState("");
            const [latitude, setLatitude] = useState<number | null>(null);
            const [longitude, setLongitude] = useState<number | null>(null);
            const [locating, setLocating] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [error, setError] = useState("");
            const [orderNumber, setOrderNumber] = useState("");

            useEffect(() => {
              if (!open || typeof document === "undefined") return;
              const previous = document.body.style.overflow;
              document.body.style.overflow = "hidden";
              return () => {
                document.body.style.overflow = previous;
              };
            }, [open]);

            if (!open) return null;

            const total = unitPrice * quantity;

            const close = () => {
              setError("");
              setOrderNumber("");
              onClose();
            };

            const useCurrentLocation = () => {
              if (typeof navigator === "undefined" || !navigator.geolocation) {
                setError("Current location is not supported on this device. You can still type your address.");
                return;
              }

              setLocating(true);
              setError("");

              navigator.geolocation.getCurrentPosition(
                (position) => {
                  const lat = Number(position.coords.latitude.toFixed(6));
                  const lng = Number(position.coords.longitude.toFixed(6));
                  setLatitude(lat);
                  setLongitude(lng);
                  setMapUrl(
                    `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${lat},${lng}`)}`,
                  );
                  setLocating(false);
                },
                () => {
                  setMapUrl("");
                  setLatitude(null);
                  setLongitude(null);
                  setError("Location permission was blocked. Type your full delivery address instead.");
                  setLocating(false);
                },
                {
                  enableHighAccuracy: true,
                  timeout: 12000,
                  maximumAge: 60000,
                },
              );
            };

            const submit = async () => {
              if (name.trim().length < 2) {
                setError("Please enter your name.");
                return;
              }
              if (phone.trim().length < 7) {
                setError("Please enter a valid phone number.");
                return;
              }
              if (address.trim().length < 5) {
                setError("Please enter your full delivery address.");
                return;
              }

              setSubmitting(true);
              setError("");

              const { data, error: submitError } = await (supabase as any).rpc(
                "create_public_order",
                {
                  p_product_id: productId,
                  p_customer_name: name.trim(),
                  p_phone: phone.trim(),
                  p_address: address.trim(),
                  p_size: size || null,
                  p_finish: finish || null,
                  p_quantity: quantity,
                  p_map_url: mapUrl || null,
                  p_latitude: latitude,
                  p_longitude: longitude,
                  p_note: note.trim() || null,
                },
              );

              setSubmitting(false);

              if (submitError) {
                setError(submitError.message || "Could not place the order. Please try again.");
                return;
              }

              const result = Array.isArray(data) ? data[0] : data;
              setOrderNumber(result?.order_number ?? "ORDER RECEIVED");
            };

            return (
              <div className="fixed inset-0 z-[100] overflow-y-auto bg-black/85 px-4 py-6 backdrop-blur-md sm:py-10">
                <div className="mx-auto flex min-h-full max-w-xl items-center justify-center">
                  <div className="glass-panel relative w-full overflow-hidden rounded-[28px] border border-border/70 bg-background/95 p-5 shadow-2xl sm:p-8">
                    <button
                      type="button"
                      onClick={close}
                      aria-label="Close order form"
                      className="absolute right-4 top-4 grid size-10 place-items-center rounded-full border border-border/60 text-muted-foreground transition-colors hover:text-foreground"
                    >
                      <X className="size-4" />
                    </button>

                    {orderNumber ? (
                      <div className="py-10 text-center">
                        <div className="mx-auto grid size-14 place-items-center rounded-full border border-chrome/60 bg-white/[0.04]">
                          <Check className="size-5 text-foreground" />
                        </div>
                        <span className="mt-7 block text-[9px] uppercase tracking-[0.45em] text-muted-foreground">
                          ZZERKOFF / ORDER
                        </span>
                        <h2 className="mt-4 font-display text-xl tracking-[0.2em] text-foreground sm:text-2xl">
                          ORDER RECEIVED
                        </h2>
                        <p className="mt-5 text-[10px] uppercase tracking-[0.35em] text-chrome">
                          {orderNumber}
                        </p>
                        <p className="mx-auto mt-6 max-w-sm text-xs leading-relaxed tracking-[0.08em] text-muted-foreground">
                          Your order is now in our studio. We will contact you on the phone number you provided to confirm delivery.
                        </p>
                        <button
                          type="button"
                          onClick={close}
                          className="mt-8 w-full rounded-full border border-chrome/50 bg-white/[0.04] px-8 py-5 text-[10px] uppercase tracking-[0.4em] text-foreground transition-colors hover:bg-white/[0.08]"
                        >
                          Continue
                        </button>
                      </div>
                    ) : (
                      <>
                        <span className="text-[9px] uppercase tracking-[0.45em] text-muted-foreground">
                          ZZERKOFF / CHECKOUT
                        </span>
                        <h2 className="mt-4 pr-12 font-display text-xl tracking-[0.2em] text-foreground">
                          PLACE ORDER
                        </h2>

                        <div className="mt-6 rounded-[20px] border border-border/60 bg-white/[0.02] p-4">
                          <div className="flex items-start justify-between gap-4">
                            <div>
                              <span className="text-[8px] uppercase tracking-[0.35em] text-muted-foreground">
                                {productCode}
                              </span>
                              <p className="mt-2 font-display text-sm tracking-[0.14em] text-foreground">
                                {productName}
                              </p>
                              <p className="mt-2 text-[9px] uppercase tracking-[0.28em] text-muted-foreground">
                                {[size, finish].filter(Boolean).join(" / ") || "STANDARD"} · QTY {quantity}
                              </p>
                            </div>
                            <p className="shrink-0 text-xs tracking-[0.18em] text-chrome">
                              {currencySymbol}
                              {total.toLocaleString("en-US")}
                            </p>
                          </div>
                        </div>

                        <div className="mt-6 space-y-4">
                          <div>
                            <label className="mb-2 block text-[8px] uppercase tracking-[0.35em] text-muted-foreground">
                              Name *
                            </label>
                            <input
                              value={name}
                              onChange={(e) => setName(e.target.value)}
                              autoComplete="name"
                              placeholder="Your name"
                              className={inputClass}
                            />
                          </div>

                          <div>
                            <label className="mb-2 block text-[8px] uppercase tracking-[0.35em] text-muted-foreground">
                              Phone number *
                            </label>
                            <input
                              type="tel"
                              value={phone}
                              onChange={(e) => setPhone(e.target.value)}
                              autoComplete="tel"
                              placeholder="01XXXXXXXXX"
                              className={inputClass}
                            />
                          </div>

                          <div>
                            <label className="mb-2 block text-[8px] uppercase tracking-[0.35em] text-muted-foreground">
                              Full delivery address *
                            </label>
                            <textarea
                              rows={3}
                              value={address}
                              onChange={(e) => setAddress(e.target.value)}
                              autoComplete="street-address"
                              placeholder="House / road / area / district"
                              className={`${inputClass} resize-none leading-relaxed`}
                            />
                          </div>

                          <div>
                            <button
                              type="button"
                              onClick={useCurrentLocation}
                              disabled={locating}
                              className="flex w-full items-center justify-center gap-2 rounded-full border border-border/70 px-5 py-4 text-[9px] uppercase tracking-[0.32em] text-muted-foreground transition-colors hover:border-chrome/60 hover:text-foreground disabled:opacity-60"
                            >
                              {locating ? (
                                <Loader2 className="size-4 animate-spin" />
                              ) : mapUrl ? (
                                <Check className="size-4" />
                              ) : (
                                <MapPin className="size-4" />
                              )}
                              {locating ? "Getting location..." : mapUrl ? "Location captured" : "Use current location"}
                            </button>

                            {mapUrl && (
                              <a
                                href={mapUrl}
                                target="_blank"
                                rel="noreferrer"
                                className="mt-3 flex items-center justify-center gap-2 text-[8px] uppercase tracking-[0.3em] text-chrome transition-colors hover:text-foreground"
                              >
                                View map pin
                                <ArrowUpRight className="size-3" />
                              </a>
                            )}
                          </div>

                          <div>
                            <label className="mb-2 block text-[8px] uppercase tracking-[0.35em] text-muted-foreground">
                              Note / landmark — optional
                            </label>
                            <textarea
                              rows={2}
                              value={note}
                              onChange={(e) => setNote(e.target.value)}
                              placeholder="Landmark, preferred delivery time, etc."
                              className={`${inputClass} resize-none leading-relaxed`}
                            />
                          </div>
                        </div>

                        {error && (
                          <p className="mt-5 rounded-2xl border border-border/60 bg-white/[0.02] px-4 py-3 text-[10px] leading-relaxed tracking-[0.08em] text-muted-foreground">
                            {error}
                          </p>
                        )}

                        <button
                          type="button"
                          onClick={submit}
                          disabled={submitting}
                          className="group mt-7 flex w-full items-center justify-center gap-3 rounded-full border border-chrome/50 bg-white/[0.04] px-8 py-6 text-[10px] uppercase tracking-[0.42em] text-foreground transition-all duration-500 hover:border-chrome hover:bg-white/[0.08] disabled:cursor-wait disabled:opacity-60"
                        >
                          {submitting ? (
                            <>
                              <Loader2 className="size-4 animate-spin" />
                              Placing order
                            </>
                          ) : (
                            <>
                              Confirm order
                              <ArrowUpRight className="size-4 transition-transform duration-500 group-hover:-translate-y-0.5 group-hover:translate-x-0.5" />
                            </>
                          )}
                        </button>

                        <p className="mt-4 text-center text-[8px] uppercase tracking-[0.25em] text-muted-foreground/70">
                          No account required · We confirm before delivery
                        </p>
                      </>
                    )}
                  </div>
                </div>
              </div>
            );
          }
          TSX

      - name: Add admin orders page
        shell: bash
        run: |
          cat > src/routes/_authenticated/admin.orders.tsx <<'TSX'
          import { createFileRoute } from "@tanstack/react-router";
          import { useMutation, useQuery, useQueryClient } from "@tanstack/react-query";
          import { useMemo, useState } from "react";
          import { ArrowUpRight, RefreshCw } from "lucide-react";
          import { supabase } from "@/integrations/supabase/client";
          import { useSite } from "@/lib/settings";

          export const Route = createFileRoute("/_authenticated/admin/orders")({
            component: AdminOrders,
          });

          const STATUSES = [
            "new",
            "confirmed",
            "processing",
            "shipped",
            "delivered",
            "cancelled",
          ] as const;

          type OrderStatus = (typeof STATUSES)[number];

          type Order = {
            id: string;
            order_number: string;
            source: string;
            status: OrderStatus;
            customer_name: string;
            phone: string;
            delivery_address: string;
            map_url: string | null;
            customer_note: string | null;
            product_name: string;
            product_code: string;
            unit_price: number | string;
            quantity: number;
            selected_size: string | null;
            selected_finish: string | null;
            total_price: number | string;
            admin_note: string;
            created_at: string;
            updated_at: string;
          };

          function AdminOrders() {
            const site = useSite();
            const queryClient = useQueryClient();
            const [filter, setFilter] = useState<"all" | OrderStatus>("all");
            const [search, setSearch] = useState("");

            const ordersQuery = useQuery({
              queryKey: ["admin-orders"],
              refetchInterval: 30000,
              queryFn: async () => {
                const { data, error } = await (supabase as any)
                  .from("orders")
                  .select("*")
                  .order("created_at", { ascending: false });

                if (error) throw error;
                return (data ?? []) as Order[];
              },
            });

            const updateStatus = useMutation({
              mutationFn: async ({ id, status }: { id: string; status: OrderStatus }) => {
                const { error } = await (supabase as any)
                  .from("orders")
                  .update({ status })
                  .eq("id", id);

                if (error) throw error;
              },
              onSuccess: () => {
                queryClient.invalidateQueries({ queryKey: ["admin-orders"] });
              },
            });

            const orders = ordersQuery.data ?? [];
            const newCount = orders.filter((o) => o.status === "new").length;

            const visible = useMemo(() => {
              const q = search.trim().toLowerCase();
              return orders.filter((o) => {
                if (filter !== "all" && o.status !== filter) return false;
                if (!q) return true;
                return [
                  o.order_number,
                  o.customer_name,
                  o.phone,
                  o.product_name,
                  o.product_code,
                  o.delivery_address,
                ]
                  .filter(Boolean)
                  .some((v) => String(v).toLowerCase().includes(q));
              });
            }, [orders, filter, search]);

            return (
              <div className="space-y-7 pb-20">
                <div className="flex flex-wrap items-end justify-between gap-4">
                  <div>
                    <span className="text-[9px] uppercase tracking-[0.45em] text-muted-foreground">
                      ZZERKOFF / STUDIO
                    </span>
                    <h1 className="mt-4 font-display text-xl tracking-[0.22em] text-foreground sm:text-2xl">
                      ORDERS
                    </h1>
                    <p className="mt-3 text-[9px] uppercase tracking-[0.3em] text-muted-foreground">
                      {orders.length} total · {newCount} new
                    </p>
                  </div>

                  <button
                    type="button"
                    onClick={() => ordersQuery.refetch()}
                    className="flex items-center gap-2 rounded-xl border border-border/60 px-4 py-3 text-[9px] uppercase tracking-[0.3em] text-muted-foreground transition-colors hover:text-foreground"
                  >
                    <RefreshCw className={`size-3.5 ${ordersQuery.isFetching ? "animate-spin" : ""}`} />
                    Refresh
                  </button>
                </div>

                <div className="glass-panel rounded-[24px] p-4 sm:p-5">
                  <div className="flex flex-col gap-3 lg:flex-row lg:items-center">
                    <input
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      placeholder="Search order / customer / phone..."
                      className="min-w-0 flex-1 rounded-xl border border-border/60 bg-white/[0.02] px-4 py-3 text-[10px] tracking-[0.08em] text-foreground outline-none placeholder:text-muted-foreground/60 focus:border-chrome/60"
                    />

                    <div className="flex gap-2 overflow-x-auto pb-1 lg:pb-0">
                      {(["all", ...STATUSES] as const).map((status) => (
                        <button
                          key={status}
                          type="button"
                          onClick={() => setFilter(status)}
                          className={`shrink-0 rounded-xl border px-3 py-3 text-[8px] uppercase tracking-[0.25em] transition-colors ${
                            filter === status
                              ? "border-chrome/60 bg-white/[0.06] text-foreground"
                              : "border-border/50 text-muted-foreground hover:text-foreground"
                          }`}
                        >
                          {status}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {ordersQuery.isLoading ? (
                  <p className="text-[10px] uppercase tracking-[0.4em] text-muted-foreground">
                    Loading orders…
                  </p>
                ) : ordersQuery.error ? (
                  <div className="glass-panel rounded-[24px] p-6">
                    <p className="text-xs leading-relaxed text-muted-foreground">
                      Could not load orders. Make sure the order database SQL has been installed in Lovable Cloud.
                    </p>
                  </div>
                ) : visible.length === 0 ? (
                  <div className="glass-panel rounded-[24px] p-8 text-center">
                    <p className="text-[10px] uppercase tracking-[0.4em] text-muted-foreground">
                      No orders found
                    </p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {visible.map((order) => {
                      const selected = [order.selected_size, order.selected_finish]
                        .filter(Boolean)
                        .join(" / ");

                      return (
                        <article key={order.id} className="glass-panel rounded-[24px] p-5 sm:p-6">
                          <div className="flex flex-wrap items-start justify-between gap-4 border-b border-border/50 pb-5">
                            <div>
                              <span className="text-[8px] uppercase tracking-[0.35em] text-muted-foreground">
                                {new Date(order.created_at).toLocaleString("en-GB", {
                                  dateStyle: "medium",
                                  timeStyle: "short",
                                })}
                              </span>
                              <h2 className="mt-3 font-display text-base tracking-[0.16em] text-foreground">
                                {order.order_number}
                              </h2>
                              <p className="mt-2 text-[8px] uppercase tracking-[0.28em] text-chrome">
                                {order.source || "website"}
                              </p>
                            </div>

                            <select
                              value={order.status}
                              onChange={(e) =>
                                updateStatus.mutate({
                                  id: order.id,
                                  status: e.target.value as OrderStatus,
                                })
                              }
                              disabled={updateStatus.isPending}
                              className="rounded-xl border border-chrome/40 bg-background px-4 py-3 text-[9px] uppercase tracking-[0.25em] text-foreground outline-none"
                            >
                              {STATUSES.map((status) => (
                                <option key={status} value={status}>
                                  {status}
                                </option>
                              ))}
                            </select>
                          </div>

                          <div className="mt-5 grid gap-6 lg:grid-cols-3">
                            <div>
                              <span className="text-[8px] uppercase tracking-[0.32em] text-muted-foreground">
                                Customer
                              </span>
                              <p className="mt-3 text-xs tracking-[0.08em] text-foreground">
                                {order.customer_name}
                              </p>
                              <a
                                href={`tel:${order.phone}`}
                                className="mt-2 block text-xs tracking-[0.08em] text-chrome hover:text-foreground"
                              >
                                {order.phone}
                              </a>
                            </div>

                            <div>
                              <span className="text-[8px] uppercase tracking-[0.32em] text-muted-foreground">
                                Object
                              </span>
                              <p className="mt-3 font-display text-sm tracking-[0.12em] text-foreground">
                                {order.product_name}
                              </p>
                              <p className="mt-2 text-[9px] uppercase tracking-[0.25em] text-muted-foreground">
                                {order.product_code}
                                {selected ? ` · ${selected}` : ""}
                                {` · QTY ${order.quantity}`}
                              </p>
                              <p className="mt-3 text-xs tracking-[0.15em] text-chrome">
                                {site.currencySymbol}
                                {Number(order.total_price).toLocaleString("en-US")}
                              </p>
                            </div>

                            <div>
                              <span className="text-[8px] uppercase tracking-[0.32em] text-muted-foreground">
                                Delivery
                              </span>
                              <p className="mt-3 whitespace-pre-line text-xs leading-relaxed tracking-[0.06em] text-muted-foreground">
                                {order.delivery_address}
                              </p>
                              {order.map_url && (
                                <a
                                  href={order.map_url}
                                  target="_blank"
                                  rel="noreferrer"
                                  className="mt-3 inline-flex items-center gap-2 text-[9px] uppercase tracking-[0.25em] text-chrome hover:text-foreground"
                                >
                                  Open map
                                  <ArrowUpRight className="size-3" />
                                </a>
                              )}
                            </div>
                          </div>

                          {order.customer_note && (
                            <div className="mt-5 border-t border-border/50 pt-5">
                              <span className="text-[8px] uppercase tracking-[0.32em] text-muted-foreground">
                                Customer note
                              </span>
                              <p className="mt-3 text-xs leading-relaxed tracking-[0.06em] text-muted-foreground">
                                {order.customer_note}
                              </p>
                            </div>
                          )}
                        </article>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          }
          TSX

      - name: Connect order button and admin navigation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Product page
          path = Path("src/routes/product.$slug.tsx")
          text = path.read_text()

          old_import = 'import { SITE, orderMessage, restockMessage, whatsappUrl } from "@/lib/site-config";'
          new_import = 'import { SITE, restockMessage } from "@/lib/site-config";\nimport { OrderModal } from "@/components/site/OrderModal";'
          if old_import not in text:
              raise SystemExit("Product import marker not found. No changes committed.")
          text = text.replace(old_import, new_import, 1)

          old_state = '  const [qty, setQty] = useState(1);\n  const soldOut = isSoldOut(product);'
          new_state = '  const [qty, setQty] = useState(1);\n  const [orderOpen, setOrderOpen] = useState(false);\n  const soldOut = isSoldOut(product);'
          if old_state not in text:
              raise SystemExit("Product state marker not found. No changes committed.")
          text = text.replace(old_state, new_state, 1)

          old_order_href = '''  const orderHref = whatsappUrl(
              orderMessage({
                name: product.name,
                code: product.product_code,
                category: product.category,
                price: Number(product.price) * qty,
                size: [size, finish].filter(Boolean).join(" / "),
                quantity: qty,
              }),
              site.whatsappNumber,
            );

          '''
          if old_order_href not in text:
              raise SystemExit("WhatsApp order block not found. No changes committed.")
          text = text.replace(old_order_href, "", 1)

          old_button = '''                <a
                            href={orderHref}
                            target="_blank"
                            rel="noreferrer"
                            className="group flex w-full items-center justify-center gap-3 rounded-full border border-chrome/50 bg-white/[0.04] px-8 py-6 text-[10px] uppercase tracking-[0.45em] text-foreground transition-all duration-700 hover:border-chrome hover:bg-white/[0.08]"
                          >
                            Order via WhatsApp
                            <ArrowUpRight className="size-4 transition-transform duration-500 group-hover:-translate-y-0.5 group-hover:translate-x-0.5" />
                          </a>'''

          new_button = '''                <button
                            type="button"
                            onClick={() => setOrderOpen(true)}
                            className="group flex w-full items-center justify-center gap-3 rounded-full border border-chrome/50 bg-white/[0.04] px-8 py-6 text-[10px] uppercase tracking-[0.45em] text-foreground transition-all duration-700 hover:border-chrome hover:bg-white/[0.08]"
                          >
                            Place order
                            <ArrowUpRight className="size-4 transition-transform duration-500 group-hover:-translate-y-0.5 group-hover:translate-x-0.5" />
                          </button>'''
          if old_button not in text:
              raise SystemExit("WhatsApp button marker not found. No changes committed.")
          text = text.replace(old_button, new_button, 1)

          anchor = '''      </div>

                {related.length > 0 && ('''
          insert = '''      </div>

                <OrderModal
                  open={orderOpen}
                  onClose={() => setOrderOpen(false)}
                  productId={product.id}
                  productName={product.name}
                  productCode={product.product_code}
                  unitPrice={Number(product.price)}
                  currencySymbol={site.currencySymbol}
                  size={size}
                  finish={finish}
                  quantity={qty}
                />

                {related.length > 0 && ('''
          if anchor not in text:
              raise SystemExit("Order modal insertion marker not found. No changes committed.")
          text = text.replace(anchor, insert, 1)
          path.write_text(text)

          # Admin navigation
          path = Path("src/routes/_authenticated/admin.tsx")
          text = path.read_text()
          old_nav = '  { label: "DASHBOARD", to: "/admin" as const },\n  { label: "OBJECTS", to: "/admin/products" as const },'
          new_nav = '  { label: "DASHBOARD", to: "/admin" as const },\n  { label: "ORDERS", to: "/admin/orders" as const },\n  { label: "OBJECTS", to: "/admin/products" as const },'
          if old_nav not in text:
              raise SystemExit("Admin navigation marker not found. No changes committed.")
          text = text.replace(old_nav, new_nav, 1)
          path.write_text(text)
          PY

