name: Install ZZERKOFF Mobile Performance V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          AUDITED_BASE="2be6ae62d1de6b6ebcdc73d3d7b9a402dd44ccaf"

          git merge-base --is-ancestor "$AUDITED_BASE" HEAD || {
            echo "Current main no longer contains the audited Performance V1 base."
            exit 1
          }

          CHANGED="$(git diff --name-only "$AUDITED_BASE"..HEAD \
            | grep -v '^\.github/workflows/install-zzerkoff-mobile-performance-v2\.yml$' \
            || true)"

          if [ -n "$CHANGED" ]; then
            echo "Main changed after the V2 audit. Stopping safely instead of overwriting newer work."
            echo "$CHANGED"
            exit 1
          fi

      - name: Create safety backup
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="backup-before-mobile-performance-v2-${GITHUB_RUN_ID}"
          git branch "$BACKUP"
          git push origin "$BACKUP"

      - name: Apply V2 performance patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/performance
          echo '' | base64 -d > .github/performance/apply-mobile-performance-v2.py
          python3 .github/performance/apply-mobile-performance-v2.py
          rm -f .github/performance/apply-mobile-performance-v2.py
          rmdir .github/performance 2>/dev/null || true

      - name: Check whitespace
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build test
        run: bun run build

      - name: Commit V2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZZERKOFF Performance Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No V2 changes to commit."
            exit 0
          fi

          git commit -m "Improve ZZERKOFF mobile LCP performance"
          git push origin main
