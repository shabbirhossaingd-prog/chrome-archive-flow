name: Fix ZZERKOFF Order Modal Crash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create safety backup branch
        shell: bash
        run: |
          set -e
          BACKUP="backup-before-order-modal-fix-${GITHUB_RUN_ID}"
          git branch "$BACKUP"
          git push origin "$BACKUP"

      - name: Fix React hook order in OrderModal
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/components/site/OrderModal.tsx")
          text = path.read_text()

          bad = "\n  if (!open) return null;\n\n  const total = unitPrice * quantity;"
          good = "\n  const total = unitPrice * quantity;"

          if bad not in text:
              raise SystemExit("Expected early-return marker not found. No changes made.")

          text = text.replace(bad, good, 1)

          marker = "\n  const close = () => {"
          if marker not in text:
              raise SystemExit("Close-function marker not found. No changes made.")

          text = text.replace(
              marker,
              "\n  if (!open) return null;\n" + marker,
              1,
          )

          path.write_text(text)
          PY

      - name: Check diff
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build test
        run: bun run build

      - name: Commit fix
        shell: bash
        run: |
          set -e
          git config user.name "ZZERKOFF Fixer"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/site/OrderModal.tsx
          git commit -m "Fix order modal React hook crash"
          git push origin main
