name: Install ZZERKOFF Mobile Performance V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          AUDITED_BASE="b12c6253cd18e18d03085fe824c9fa1d5d7c855a"
          git merge-base --is-ancestor "$AUDITED_BASE" HEAD || {
            echo "Main no longer contains the audited Commerce base."
            exit 1
          }
          CHANGED="$(git diff --name-only "$AUDITED_BASE"..HEAD | grep -v '^\.github/workflows/install-zzerkoff-mobile-performance-v1\.yml$' || true)"
          if [ -n "$CHANGED" ]; then
            echo "Main changed after the audit. Stopping safely."
            echo "$CHANGED"
            exit 1
          fi

      - name: Create safety backup
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="backup-before-mobile-performance-${GITHUB_RUN_ID}"
          git branch "$BACKUP"
          git push origin "$BACKUP"

      - name: Install optimized source
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/zzerkoff-mobile-performance-v1.tar.gz
          tar -xzf /tmp/zzerkoff-mobile-performance-v1.tar.gz -C .

      - name: Optimize static visual assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 .perf-optimize-static.py
          python3 .perf-patch-static.py
          rm -f .perf-optimize-static.py .perf-patch-static.py

      - name: Check whitespace
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Performance build summary
        shell: bash
        run: |
          echo "Largest client JS files:"
          find .output/public/assets -maxdepth 1 -type f -name '*.js' -printf '%s %f\n' | sort -nr | head -10 || true
          echo "Optimized source assets:"
          ls -lh src/assets/*.webp public/images/zzerkoff-logo.webp || true

      - name: Commit optimized website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZZERKOFF Performance Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Optimize ZZERKOFF mobile performance"
          git push origin main
