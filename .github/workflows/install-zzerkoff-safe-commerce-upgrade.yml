name: ZZERKOFF Safe Commerce Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create backup branch
        shell: bash
        run: |
          set -e
          BACKUP="backup-before-safe-commerce-${GITHUB_RUN_ID}"
          git branch "$BACKUP"
          git push origin "$BACKUP"

      - name: Record migration
        run: echo '' | base64 -d > supabase/migrations/20260816190000_safe_commerce_upgrade.sql

      - name: Patch checkout
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Patch settings
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Patch orders
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Fix order button
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Upgrade dashboard
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Diff check
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build test
        run: bun run build

      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name "ZZERKOFF Upgrade Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade ZZERKOFF payments stock and order admin"
          git push origin main
