name: ZZERKOFF Professional Website Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create safety backup branch
        shell: bash
        run: |
          set -e
          BACKUP="backup-before-professional-upgrade-${GITHUB_RUN_ID}"
          git branch "$BACKUP"
          git push origin "$BACKUP"

      - name: Install website upgrade
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/zzerkoff-professional-upgrade.py
          python3 /tmp/zzerkoff-professional-upgrade.py

      - name: Check whitespace
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build test
        run: bun run build

      - name: Commit upgrade
        shell: bash
        run: |
          set -e
          git config user.name "ZZERKOFF Upgrade Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add tracking policies SEO and professional order UX"
          git push origin main
