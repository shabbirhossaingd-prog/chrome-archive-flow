name: Install ZZERKOFF Commerce Experience

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create safety backup
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="backup-before-commerce-${GITHUB_RUN_ID}"
          git branch "$BACKUP"
          git push origin "$BACKUP"

      - name: Install commerce files
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/zzerkoff-commerce.tar.gz
          tar -xzf /tmp/zzerkoff-commerce.tar.gz -C .
          python3 .commerce-patch.py
          rm -f .commerce-patch.py

      - name: Check whitespace
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build test
        run: bun run build

      - name: Commit commerce upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZZERKOFF Commerce Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add ZZERKOFF commerce experience features"
          git push origin main
